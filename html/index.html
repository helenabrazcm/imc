<!DOCTYPE html> <!-- # Define que o documento é HTML5 -->
<html lang="pt-BR"> <!-- # Define o idioma da página -->
<head>
    <meta charset="UTF-8"> <!-- # Define o padrão de caracteres -->
    <title>Calculadora de IMC</title> <!-- # Título da aba do navegador -->
    <link rel="stylesheet" href="style.css"> <!-- # Importa o CSS externo -->
</head>
<body>
    <div class="container"> <!-- # Container principal -->
        <h2>Calculadora de IMC</h2> <!-- # Título exibido na página -->

        <label for="peso">Peso (kg):</label> <!-- # Rótulo do campo peso -->
        <input type="number" id="peso" placeholder="Ex: 70"> <!-- # Campo para digitar o peso -->

        <label for="altura">Altura (m):</label> <!-- # Rótulo do campo altura -->
        <input type="number" step="0.01" id="altura" placeholder="Ex: 1.75"> <!-- # Campo para digitar a altura -->

        <button onclick="calcularIMC()">Calcular</button> <!-- # Botão que chama a função JS -->

        <div class="resultado" id="resultado"></div> <!-- # Área onde aparece o resultado -->
    </div>

    <script src="script.js"></script> <!-- # Importa o JS externo -->
</body>
</html>
